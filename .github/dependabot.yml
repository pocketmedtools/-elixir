# Monthly update proposals (as pull requests, never merged automatically) so
# Capacitor/Android support and build tools keep up with new phones. Every
# proposal is tested by the "Weekly health check and backup" workflow.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Major versions (e.g. a new Capacitor) change the Android app and need a
    # planned, tested upgrade - not an automatic proposal.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-packages:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-actions:
        patterns: ["*"]
