name: Build FM Prep Android APK

# Builds the FM Prep exam app as a signed Android APK and publishes it to a
# rolling GitHub Release, so the download link never changes:
#   https://github.com/<owner>/<repo>/releases/download/fmprep-apk-latest/FM-Prep.apk
#
# This is FM Prep's own workflow. It reads only fmprep/, uses its own release
# tags (fmprep-apk-latest, fmprep-signing-key) and never touches web/, the
# Pocket-Med workflow, or the gh-pages branch.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/fm-study-material-app-y84obf]
    paths:
      - "fmprep/**"
      - ".github/workflows/fmprep-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fmprep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fmprep/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Content checks gate the APK the same way they gate the site: a wrong
      # answer key or an unbalanced bold marker fails the build here too.
      - name: Verify content and build the web app
        run: npm run build:apk

      # `packages: ''` is load-bearing. The action's default is to install
      # `tools`, which Google has withdrawn from the SDK repository, so
      # sdkmanager exits 1 and the whole build dies before it compiles
      # anything. The runner image already ships platform-tools and
      # build-tools; all this step still needs to do is point ANDROID_HOME at
      # them, and Gradle fetches whatever else the project asks for.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # The Android project is generated fresh each run from capacitor.config.ts.
      - name: Generate the Android project
        run: |
          npx cap add android
          npx cap sync android

      # App icon from the PWA's own 512px icon, copied as-is into every density
      # folder - Android scales a launcher PNG down itself, so no image tool is
      # needed (the runner image no longer ships ImageMagick). The adaptive-icon
      # XML is removed so nothing references a resource that was never made.
      - name: App icon
        run: |
          SRC=public/icon-512.png
          if [ ! -f "$SRC" ]; then echo "no $SRC; keeping the default icon"; exit 0; fi
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp "$SRC" "$RES/mipmap-$d/ic_launcher.png"
            cp "$SRC" "$RES/mipmap-$d/ic_launcher_round.png"
            cp "$SRC" "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          ls -la "$RES"/mipmap-xxxhdpi/

      # A stable signing identity lets updates install over old versions. It is
      # kept on a dedicated release tag; it is an install identity, not a
      # confidential credential (impossible in a public repository).
      - name: Obtain signing keystore
        run: |
          mkdir -p keystore
          if curl -fL -o keystore/fmprep-release.keystore \
            "https://github.com/${{ github.repository }}/releases/download/fmprep-signing-key/fmprep-release.keystore"; then
            echo "Reusing the existing FM Prep signing identity"
            echo "NEW_KEY=0" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore keystore/fmprep-release.keystore -alias fmprep \
              -keyalg RSA -keysize 2048 -validity 10950 -storepass fmprep -keypass fmprep \
              -dname "CN=FM Prep, OU=Exam Preparation, O=FM Prep, C=IN"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Persist a newly created signing identity
        if: env.NEW_KEY == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fmprep-signing-key
          name: FM Prep install identity
          body: "Stable APK signing identity used by the FM Prep build workflow so updates install over previous versions."
          files: fmprep/keystore/fmprep-release.keystore

      - name: Build release APK (unsigned)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      # Sign with apksigner rather than editing the generated Gradle file, so
      # the project stays exactly what Capacitor emits.
      - name: Align and sign
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$UNSIGNED" ] || UNSIGNED=android/app/build/outputs/apk/release/app-release.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" FM-Prep-aligned.apk
          "$BT/apksigner" sign --ks keystore/fmprep-release.keystore --ks-key-alias fmprep \
            --ks-pass pass:fmprep --key-pass pass:fmprep --out FM-Prep.apk FM-Prep-aligned.apk
          "$BT/apksigner" verify FM-Prep.apk
          ls -la FM-Prep.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM-Prep-apk
          path: fmprep/FM-Prep.apk
          if-no-files-found: error

      # The primary download link. A release asset redirects github.com -> a
      # signed S3 URL, and Android's download manager stalls on that hop at
      # 100 per cent. raw.githubusercontent.com serves the file directly, so
      # the APK lives on its own single-commit branch, force-pushed each build.
      #   https://raw.githubusercontent.com/<owner>/<repo>/fmprep-apk/FM-Prep.apk
      - name: Publish APK at a direct URL
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf /tmp/apkpub && mkdir -p /tmp/apkpub
          cp fmprep/FM-Prep.apk /tmp/apkpub/
          cd /tmp/apkpub
          git init -q -b fmprep-apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FM-Prep.apk
          git commit -q -m "FM-Prep.apk built from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fmprep-apk

      # Uploaded through the API rather than by an action. The action deleted
      # the existing asset before uploading the replacement, so an upload that
      # failed left the release holding nothing - which is what happened on
      # 17 Sep: "Deleting previously uploaded asset FM-Prep.apk... Uploading
      # FM-Prep.apk... Error saving asset", after which the release page
      # listed only the two source archives and the download URL answered 404.
      #
      # Here the new file goes up under a temporary name, the old asset is
      # removed only once that upload has succeeded, and the new one is then
      # renamed into place. Every ordering of failures leaves a downloadable
      # APK on the release.
      - name: Publish APK to the rolling release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: fmprep-apk-latest
        run: |
          set -euo pipefail
          api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }

          ID=$(api "https://api.github.com/repos/$REPO/releases/tags/$TAG" | jq -r '.id // empty') || ID=""
          if [ -z "$ID" ]; then
            ID=$(api -X POST "https://api.github.com/repos/$REPO/releases" \
              -d "$(jq -n --arg t "$TAG" '{
                    tag_name: $t, name: "FM Prep Android app",
                    body: "Latest FM Prep Android APK - the DNB / MD Family Medicine revision library.\n\nDownload **FM-Prep.apk** below, open it on the phone, and allow install from this source.\nUpdates install over the previous version.\n"
                  }')" | jq -r .id)
            echo "created release $ID"
          fi

          assets() { api "https://api.github.com/repos/$REPO/releases/$ID/assets?per_page=100"; }
          drop() {
            local aid
            aid=$(assets | jq -r --arg n "$1" '.[] | select(.name == $n) | .id' | head -1)
            [ -n "$aid" ] && api -X DELETE "https://api.github.com/repos/$REPO/releases/assets/$aid" >/dev/null && echo "removed $1"
            return 0
          }

          # Clear any half-finished upload left by an earlier run.
          drop FM-Prep-incoming.apk

          NEW=$(api -X POST \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @fmprep/FM-Prep.apk \
            "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=FM-Prep-incoming.apk" \
            | jq -r '.id')
          [ -n "$NEW" ] && [ "$NEW" != "null" ] || { echo "upload did not return an asset id"; exit 1; }
          echo "uploaded as asset $NEW"

          drop FM-Prep.apk
          api -X PATCH "https://api.github.com/repos/$REPO/releases/assets/$NEW" \
            -d '{"name":"FM-Prep.apk"}' >/dev/null

          assets | jq -r '.[] | "\(.name)  \(.size) bytes  \(.state)"'
