<svg xmlns="http://www.w3.org/2000/svg" viewBox="59.077 47.077 393.846 393.846" role="img" aria-label="FM Prep">
  <!-- Same geometry as scripts/makeIcon.py, in the same 512 grid; the viewBox
       is that script's crop, so the favicon and the app icon are one drawing. -->
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26804f"/>
      <stop offset="1" stop-color="#0e3a26"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.4" fill="#e8e4db"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="#fdfbf7"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#dots)"/>
  <!-- handles -->
  <g fill="#14120f">
    <rect x="114.5" y="109" width="11" height="41" rx="5.5"/>
    <rect x="200" y="109" width="11" height="41" rx="5.5"/>
  </g>
  <!-- the bag, green where Pocket-Med's is blue -->
  <rect x="74" y="145" width="178" height="178" rx="38" fill="url(#bag)"/>
  <g fill="#ffffff" opacity="0.16">
    <rect x="136" y="192" width="53" height="23" rx="5"/>
    <rect x="152" y="177" width="22" height="52" rx="5"/>
  </g>
  <!-- stethoscope -->
  <path d="M165 318 V327 A56 56 0 0 0 277 327 V310" fill="none" stroke="#14120f" stroke-width="9" stroke-linecap="round"/>
  <!-- the trace -->
  <polyline points="0,292 103,292 115,266 130,316 141,292 512,292" fill="none" stroke="#00ff6a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="271" cy="296" r="16" fill="none" stroke="#14120f" stroke-width="7"/>
  <circle cx="271" cy="296" r="6.5" fill="#00ff6a"/>
  <text x="256" y="251" text-anchor="middle" dominant-baseline="central"
        font-family="Outfit, Inter, 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="52"
        fill="#8b0000" stroke="#ffffff" stroke-width="7" paint-order="stroke">FM Prep</text>
</svg>
